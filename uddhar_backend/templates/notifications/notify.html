<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Alert from Uddhar</h1>
    <h3>Details:</h3>
    <p>
      <span style="font-weight: bold"> Help needed: </span>
      {% for category1 in affected.category %} {{ category1 }}  {% endfor %}
      <br>
      <span style="font-weight: bold"> Description: </span>
      <br>
      {{ affected.description }}
      <br>
      <span style="font-weight: bold"> Contact No: </span> {{ affected.contact_number }}
      <br>
      <span style="font-weight: bold"> Alternative Contact No: </span> {{ affected.alternative_contact_number }}
      <br>
      <span style="font-weight: bold"> Requested from: </span> 
      <a href="https://maps.google.com/?q={{ affected.latitude }},{{ affected.longitude }}">
        Map Link
      </a>
      
    </p>
  </body>
</html>
